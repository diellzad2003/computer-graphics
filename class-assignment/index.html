<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pink Cone VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <a-entity camera look-controls position="0 1.6 0"></a-entity>

     
      <a-plane rotation="-90 0 0" width="30" height="30" color="#FADADD"></a-plane>

     
      <a-cone
        position="0 1 -3"
        radius-bottom="0.5"
        radius-top="0"
        height="1"
        color="#FF69B4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"
        animation__float="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 0 1.3 -3">
      </a-cone>

     
      <a-sphere position="-2 2 -4" radius="0.06" color="#FFFFFF"
        animation="property: position; dir: alternate; dur: 2500; loop: true; to: -2 2.3 -4"></a-sphere>
      <a-sphere position="2 1.8 -5" radius="0.05" color="#FFFFFF"
        animation="property: position; dir: alternate; dur: 3000; loop: true; to: 2 2.1 -5"></a-sphere>
      <a-sphere position="0.8 2.6 -3.5" radius="0.04" color="#FFFFFF"
        animation="property: position; dir: alternate; dur: 2200; loop: true; to: 0.8 2.9 -3.5"></a-sphere>

     
      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" intensity="0.8" position="2 4 1"></a-light>

     
      <a-sky color="#FFE6F0"></a-sky>

    </a-scene>
  </body>
</html>
