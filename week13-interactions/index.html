<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 13 - Interactions</title>
  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; }
    #wrap { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
    #scene { width: 100%; height: 100%; background: #0b0f1a; }
    #panel {
      padding: 16px;
      border-left: 1px solid #ddd;
      background: #fff;
      overflow: auto;
    }
    #panel h2 { margin: 0 0 10px; font-size: 18px; }
    .hint { color: #444; margin-bottom: 12px; }
    .row { margin: 8px 0; }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="scene"></div>

    <aside id="panel">
      <h2>Cube Info</h2>
      <div id="info" class="hint">Click a cube to see its information here.</div>
    </aside>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
